[package]
name = "bomvoyage"
version = "0.2.2"
edition = "2021"
description = "BOMvoyage — temporal SBOM generator and explorer, powered by RelateDB"
license = "Apache-2.0"
repository = "https://github.com/b33f/BOMvoyage"

[[bin]]
name = "bomvoyage"
path = "src/main.rs"

[dependencies]
relate = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
httparse = "1"
toml = "1"
quick-xml = "0.42"
# self-update: GitHub release check + verified in-place binary upgrade
ureq = { version = "3", features = ["json"] }
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# serve path: graceful Ctrl+C — stop accepting, let the history walk finish
ctrlc = { version = "3.5", features = ["termination"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
