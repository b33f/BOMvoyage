[package]
name = "bomvoyage"
version = "0.1.0"
edition = "2021"
description = "BOMvoyage — temporal SBOM generator and explorer, powered by RelateDB"
license = "Apache-2.0"
repository = "https://github.com/b33f/BOMvoyage"

[[bin]]
name = "bomvoyage"
path = "src/main.rs"

[dependencies]
relate = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
httparse = "1"
toml = "0.8"
quick-xml = "0.42"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
