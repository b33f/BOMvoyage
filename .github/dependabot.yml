# Weekly dependency updates: the build's own dependencies (actions) and the
# Rust crate graph. Security updates are handled separately by Dependabot
# alerts + automatic security updates (enabled in the repo settings).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
