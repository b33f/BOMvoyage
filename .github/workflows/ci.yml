name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI never needs write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: build + test (${{ matrix.os }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked --release
      - name: Test
        run: cargo test --locked --release
      - name: Smoke test (scan this repo, run an as-of query)
        run: |
          cargo run --locked --release --quiet -- scan . --db smoke.rl --max-commits 50
          cargo run --locked --release --quiet -- query --db smoke.rl "MATCH ()-[r:DECLARES]->() RETURN count(r) AS c"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  deps:
    # Supply-chain gate: RustSec advisories (including known-malicious
    # crates), dependency sources restricted to crates.io (no surprise git
    # deps), duplicate-crate warnings, and Cargo.lock integrity.
    # Config: deny.toml. Run locally: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
      # Lockfile tamper guard: Cargo.lock must be exactly in sync with the
      # manifests and carry only checksummed crates.io entries — a PR that
      # hand-edits the lock (swapped source URL, dropped checksum, a dep
      # Cargo.toml forgot) fails here before it can merge.
      - name: Lockfile is in sync with manifests (--locked resolves)
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: No checksum-less or git-sourced entries in Cargo.lock
        run: |
          python3 - <<'EOF'
          import json, re, subprocess, sys
          meta = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          members = {p["name"] for p in meta["packages"]}  # workspace crates have no registry source
          lock = open("Cargo.lock").read()
          for block in lock.split("[[package]]")[1:]:
              name = re.search(r'name = "([^"]+)"', block).group(1)
              version = re.search(r'version = "([^"]+)"', block).group(1)
              if name in members:
                  continue
              source = re.search(r'source = "([^"]+)"', block)
              if source is None:
                  sys.exit(f"FAIL: {name} {version} has no registry source (not crates.io-pinned)")
              if not source.group(1).startswith("registry+https://github.com/rust-lang/crates.io-index"):
                  sys.exit(f"FAIL: {name} {version} comes from a non-crates.io source: {source.group(1)}")
              if re.search(r'checksum = ', block) is None:
                  sys.exit(f"FAIL: {name} {version} has no checksum")
          print("all external entries are checksummed crates.io pins")
          EOF
