# Supply-chain lint for the Rust dependency graph, enforced in CI
# (.github/workflows/ci.yml, `deps` job). Run locally with: cargo deny check

[graph]
all-features = true

[licenses]
version = 2
# Standard permissive licenses only; anything else (copyleft, unknown,
# proprietary) fails the deps CI job.
allow = [
  "Apache-2.0",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"
# Documented exceptions only — each with the reason and the fix path:
ignore = [
    # `paste` (dtolnay) is archived/unmaintained; it is a build-time macro crate
    # reached only through parquet 54.x <- relate-storage 1.0.1 <- relate 1.0.1.
    # No vulnerability — remove when a new `relate` release drops it.
    "RUSTSEC-2024-0436",
    # Apache Thrift unbounded allocation in `read_bytes` (Dependabot alert #1),
    # fixed in thrift 0.23.0 but pinned to ^0.17 by parquet 54.x <-
    # relate-storage 1.0.1 <- relate 1.0.1. Exposure is local-only: thrift here
    # parses .rl snapshot files this tool itself wrote. Fix when `relate`
    # publishes a release on a newer parquet chain.
    "RUSTSEC-2026-0435",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
