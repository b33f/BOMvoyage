# Supply-chain lint for the Rust dependency graph, enforced in CI
# (.github/workflows/ci.yml, `deps` job). Run locally with: cargo deny check

[graph]
all-features = true

[licenses]
version = 2
# Standard permissive licenses only; anything else (copyleft, unknown,
# proprietary) fails the deps CI job.
allow = [
  "Apache-2.0",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # Boost Software License 1.0 — standard permissive. Pulled in by
  # xxhash-rust < relate-executor < relate 1.1.0.
  "BSL-1.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"
# Documented exceptions only — each with the reason and the fix path:
ignore = [
    # chrono and chrono-tz are unmaintained (chronotope winding down, see
    # chronotope/chrono#1768). Transitive only: arrow-arith <- relate-storage
    # <- relate. No vulnerability; remove when `relate` moves off the
    # chrono/arrow chain. (Locally these warn "not encountered" on
    # cargo-deny >= 0.22, which scopes unmaintained to workspace deps —
    # CI's pinned action runs 0.20.2, which checks the whole graph.)
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
